# ============================================================================
# nginx 配置（Linux 版 · 放到 /etc/nginx/conf.d/sky.conf）
#
# 与 Windows 版的区别：这是"片段"文件，只含 server 块，直接丢进 conf.d 就行，
# 不用动 /etc/nginx/nginx.conf 主配置。
#
# 分工：
#   浏览器 :80    → /opt/sky/web-zh   中文前端
#   浏览器 :8081  → /opt/sky/web-en   英文前端
#   :80/admin/、:80/user/ → 127.0.0.1:8080  后端 jar
#   :80/ws/               → 127.0.0.1:8080  WebSocket（来单提醒）
#   :80/img/              → 127.0.0.1:9000  MinIO 图片（9000 不对外）
#
# 用法：
#   sudo cp nginx-sky.conf /etc/nginx/conf.d/sky.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ 安全组/防火墙只开 80 和 8081；3306/6379/8080/9000 都只绑 127.0.0.1
# ============================================================================

# 中文版：http://<公网IP>/
server {
    listen       80;
    server_name  _;

    # 必须大于后端的上传限制（spring.servlet.multipart.max-file-size=10MB）
    client_max_body_size 20m;

    root   /opt/sky/web-zh;
    index  index.html;

    access_log  /var/log/nginx/sky.access.log;
    error_log   /var/log/nginx/sky.error.log;

    # ① SPA 回退：前端路由（/orders、/admin/dishes…）刷新时不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ② 管理端接口
    #    前端路由也用 /admin 前缀，所以先看 Accept：
    #      浏览器地址栏导航（Accept 含 text/html）→ 交给前端路由
    #      真正的接口请求（axios，Accept 是 application/json）→ 反代给后端
    location /admin/ {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://127.0.0.1:8080/admin/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ③ 用户端接口
    location /user/ {
        proxy_pass http://127.0.0.1:8080/user/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ④ WebSocket（来单提醒/催单/预约提醒，缺 Upgrade 头就连不上）
    location /ws/ {
        proxy_pass http://127.0.0.1:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ⑤ 图片：反代 MinIO，公网只开 80/8081，9000 不暴露
    #    配套设置：sky.minio.public-base-url: http://<公网IP>/img
    #    ⚠️ proxy_pass 结尾只能是一个 "/"，不能写 /photo/ ：
    #       后端返回的地址是 <public-base-url>/<bucket>/<object>，即 /img/photo/xxx.jpg。
    #       nginx 会把匹配到的 /img/ 替换成 proxy_pass 的 URI，写成 /photo/ 就变成
    #       /photo/photo/xxx.jpg → MinIO 报 NoSuchKey(404)。
    location /img/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}

# 英文版（Bread Takeaway）：http://<公网IP>:8081/
server {
    listen       8081;
    server_name  _;

    client_max_body_size 20m;

    root   /opt/sky/web-en;
    index  index.html;

    access_log  /var/log/nginx/sky-en.access.log;
    error_log   /var/log/nginx/sky-en.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /admin/ {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://127.0.0.1:8080/admin/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /user/ {
        proxy_pass http://127.0.0.1:8080/user/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /img/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
