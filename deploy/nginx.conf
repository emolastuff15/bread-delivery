# ============================================================================
# nginx 配置（Windows Server 版 · 完整文件）
#
# 放到：C:\sky\middleware\nginx\conf\nginx.conf
#       （直接覆盖 nginx for Windows 自带的那个 conf\nginx.conf）
#
# 分工：
#   浏览器 :80    → C:\sky\web-zh   中文前端
#   浏览器 :8081  → C:\sky\web-en   英文前端
#   浏览器 :80/admin/、:80/user/ → 127.0.0.1:8080  后端 jar
#   浏览器 :80/ws/               → 127.0.0.1:8080  WebSocket（来单提醒）
#   浏览器 :80/img/              → 127.0.0.1:9000  MinIO 图片（9000 不对外）
#
# 用法（在 C:\sky\middleware\nginx 目录下执行）：
#   nginx -t            检查语法
#   start nginx         启动
#   nginx -s reload     改完本文件后重载
#   nginx -s stop       停止
#
# ⚠️ Windows 上路径一律用正斜杠 /（别用单个反斜杠）
# ⚠️ 下面 access_log/error_log 用的是相对路径 logs/，它相对 nginx 的安装目录
#    （C:\sky\middleware\nginx\logs）。这个 logs 目录是 zip 自带的；
#    万一没有，nginx 会直接 [emerg] 起不来 —— deploy\start-nginx.bat 里已经
#    加了自动创建，用那个脚本启动就不会踩到。
# ⚠️ 若服务器装了 IIS，80 端口会被它占着，nginx 起不来。先查再停：
#       netstat -ano | findstr :80       看是谁占了
#       sc stop W3SVC                    停掉 IIS
# ============================================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 中文版：http://<公网IP>/
    server {
        listen       80;
        server_name  _;

        # 必须大于后端的上传限制（spring.servlet.multipart.max-file-size=10MB）
        client_max_body_size 20m;

        root   C:/sky/web-zh;
        index  index.html;

        access_log  logs/sky.access.log;
        error_log   logs/sky.error.log;

        # ① SPA 回退：前端路由（/orders、/admin/dishes…）刷新时不能 404
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ② 管理端接口
        #    前端路由也用 /admin 前缀，所以先看 Accept：
        #      浏览器地址栏导航（Accept 含 text/html）→ 交给前端路由
        #      真正的接口请求（axios，Accept 是 application/json）→ 反代给后端
        location /admin/ {
            if ($http_accept ~* "text/html") {
                rewrite ^ /index.html last;
            }
            proxy_pass http://127.0.0.1:8080/admin/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ③ 用户端接口
        location /user/ {
            proxy_pass http://127.0.0.1:8080/user/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ④ WebSocket（来单提醒/催单/预约提醒，缺 Upgrade 头就连不上）
        location /ws/ {
            proxy_pass http://127.0.0.1:8080/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ⑤ 图片：反代 MinIO，这样公网只开 80/8081，9000 不用暴露
        #    配套设置：sky.minio.public-base-url: http://<公网IP>/img
        #    ⚠️ proxy_pass 结尾只能是一个 "/"，不能写 /photo/ ：
        #       后端返回 /img/photo/xxx.jpg，nginx 把 /img/ 替换成 proxy_pass 的 URI，
        #       写成 /photo/ 会变成 /photo/photo/xxx.jpg → MinIO NoSuchKey(404)
        location /img/ {
            proxy_pass http://127.0.0.1:9000/;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public";
        }
    }

    # 英文版（Bread Takeaway）：http://<公网IP>:8081/
    server {
        listen       8081;
        server_name  _;

        client_max_body_size 20m;

        root   C:/sky/web-en;
        index  index.html;

        access_log  logs/sky-en.access.log;
        error_log   logs/sky-en.error.log;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /admin/ {
            if ($http_accept ~* "text/html") {
                rewrite ^ /index.html last;
            }
            proxy_pass http://127.0.0.1:8080/admin/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /user/ {
            proxy_pass http://127.0.0.1:8080/user/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://127.0.0.1:8080/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /img/ {
            proxy_pass http://127.0.0.1:9000/;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public";
        }
    }
}
